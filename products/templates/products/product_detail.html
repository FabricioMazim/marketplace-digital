{% extends "base.html" %}

{% block title %}
{{ product.name }} | Marketplace Digital
{% endblock %}

{% block content %}

<section class="product-detail">
    <div class="container">

        <span class="product-tag">
            Produto digital
        </span>

        <h1>{{ product.name }}</h1>

        <p>{{ product.description }}</p>

        <h2>R$ {{ product.price }}</h2>

        <a href="#" class="btn-primary">
            Comprar agora
        </a>

    </div>
</section>

{% endblock %}
